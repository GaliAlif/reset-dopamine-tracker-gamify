<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07091c"><meta name="description" content="RESET — Take back your attention.">
  <title>RESET — Dopamine Level Reset & Learn</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark"><i data-lucide="activity"></i></span><span><b>RESET</b><small>ATTENTION SYSTEM</small></span></a>
      <div class="side-label">MAIN SYSTEM</div>
      <nav id="navigation">
        <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
        <button class="nav-item" data-page="quests"><i data-lucide="target"></i>Daily Quests</button>
        <button class="nav-item" data-page="activities"><i data-lucide="activity"></i>Activity Log</button>
        <button class="nav-item" data-page="urge"><i data-lucide="brain"></i>Urge Tracker</button>
        <button class="nav-item" data-page="focus"><i data-lucide="timer"></i>Focus Room</button>
        <button class="nav-item" data-page="learning"><i data-lucide="graduation-cap"></i>Learning Center</button>
        <div class="side-label">PROGRESSION</div>
        <button class="nav-item" data-page="analytics"><i data-lucide="chart-no-axes-combined"></i>Analytics</button>
        <button class="nav-item" data-page="skills"><i data-lucide="network"></i>Skill Tree</button>
        <button class="nav-item" data-page="achievements"><i data-lucide="trophy"></i>Achievements</button>
        <button class="nav-item" data-page="shop"><i data-lucide="shopping-bag"></i>Rewards Shop</button>
        <div class="side-label">SYSTEM</div>
        <button class="nav-item" data-page="settings"><i data-lucide="settings"></i>Settings</button>
      </nav>
      <div class="sidebar-foot"><span class="online-dot"></span> LOCAL SYSTEM ONLINE <small>DATA STORED ON THIS DEVICE</small></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu"><i data-lucide="menu"></i></button>
        <div class="breadcrumb"><span>RESET SYSTEM</span><b>/</b><strong id="pageName">DASHBOARD</strong></div>
        <div class="player-hud">
          <div class="avatar" id="avatar">A</div>
          <div class="player-name"><b id="topUsername">PLAYER</b><small id="topLevel">LVL 1 · INITIATE</small></div>
          <div class="hud-xp"><div class="hud-xp-label">XP <b id="topXP">0 / 100</b></div><div class="progress"><span id="topXPBar"></span></div></div>
          <div class="credits"><i data-lucide="coins"></i><b id="topCredits">0</b><small>NC</small></div>
        </div>
      </header>
      <section class="content" id="app"></section>
      <footer class="footer">RESET // ATTENTION DEVELOPMENT SYSTEM <span>V1.0.0 · LOCAL-FIRST</span></footer>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
